<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Search</title>
</head>
<body>
<header>
    <h1>Speed Search</h1>
</header>
<main>
<section>
<form action="https://www.google.com/search?">
    <label for="g">Google:</label>
    <input id="g" type="text" name="q" placeholder="Search Here"> 
    <button type="submit">Submit</button>
</form>
</section>
<br/>
<section>
<form action="https://www.youtube.com/results?search_query=">
<label for="y">Youtube:</label>
<input type="text" type="text" name="search_query" placeholder="Search Here">
<button type="submit">Submit</button>
</section>
</form>
<footer>
    
</footer>
</main>
</body>
</html>
